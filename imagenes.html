<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Museo de la vida rural El Canario</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;700&family=Montserrat:wght@300;400;700&family=Lato:wght@400;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles/styles.css" />

  <!-- Escritorio: la tarjeta de Imágenes replica el alto de las demás páginas.
       En el resto de secciones ese alto lo fija la foto vertical (relación 0.8)
       que ocupa el 43% derecho; aquí las fotos del carrusel son cuadradas, así
       que damos a la caja la misma proporción vertical (0.8) para igualar la
       altura, y enmarcamos la imagen cuadrada con margen uniforme y redondeo
       en las cuatro esquinas (no pegada a los bordes del card). -->
  <style>
    @media (min-width: 1101px) {
      .card-media {
        aspect-ratio: 0.8 !important;   /* misma proporción que las fotos del resto */
        padding: 18px !important;        /* margen: la imagen no toca los bordes */
        border-radius: 0 !important;     /* el redondeo exterior lo aporta el card */
      }
      .card-media img {
        border-radius: var(--radius) !important;  /* curvatura en las 4 esquinas */
      }
      /* El pie se coloca sobre la foto, dentro del margen de 18px (no sobre el
         fondo blanco de la caja), y replica el redondeo inferior de la imagen */
      .card-caption {
        left:18px;
        right:18px;
        bottom:18px;
        border-radius: 0 0 var(--radius) var(--radius);
      }
    }

    /* El pie del carrusel lleva contador a la derecha: el título puede ocupar
       dos líneas, pero el contador nunca salta a la línea siguiente */
    .card-caption {
      flex-wrap: nowrap;
    }
    .card-caption .caption-counter {
      flex: 0 0 auto;
      text-align: right;
    }
  </style>
</head>
<body>
  <div class="viewport-fixed">

    <!-- Header fijo -->
    <header class="site-header" role="banner">
      <div class="header-inner">
        <a class="brand" href="index.html">
          <img src="assets/svg/Logo.svg" alt="Logo Museo El Canario" class="logo-img" />
          <span class="brand-text">Museo de la vida rural El Canario</span>
        </a>

        <nav class="main-nav" aria-label="Navegación principal">
          <a href="cronograma.html" class="nav-link">Cronograma</a>
          <a href="imagenes.html" class="nav-link">Imágenes</a>
          <a href="biografia.html" class="nav-link">Biografía</a>
          <a href="contacto.html" class="nav-link">Contacto</a>
        </nav>

        <!-- Toggle móvil -->
        <button class="menu-toggle" id="menuToggle" aria-label="Abrir menú" aria-expanded="false" type="button">
          <svg class="menu-icon" width="48" height="48" viewBox="0 0 48 48" aria-hidden="true" focusable="false">
            <circle class="menu-circle" cx="24" cy="24" r="20" fill="#c0392b" />
            <g class="bars" stroke="#fff" stroke-linecap="round" stroke-width="3" stroke-linejoin="round">
              <line class="bar top" x1="14" y1="18" x2="34" y2="18" />
              <line class="bar bottom" x1="14" y1="30" x2="34" y2="30" />
            </g>
          </svg>
        </button>
      </div>
    </header>

    <!-- Menú desplegable móvil -->
    <aside class="floating-menu" id="floatingMenu" aria-hidden="true">
      <div class="floating-inner">
        <nav class="floating-nav" aria-label="Navegación flotante">
          <a href="cronograma.html">Cronograma</a>
          <a href="imagenes.html">Imágenes</a>
          <a href="biografia.html">Biografía</a>
          <a href="contacto.html">Contacto</a>
        </nav>
      </div>
    </aside>

    <!-- Hero -->
    <main class="hero" role="main" aria-label="Hero">
      <div class="hero-overlay" aria-hidden="true"></div>

      <section class="card container" role="region" aria-label="Tarjeta principal">
        <div class="card-inner">
          <div class="card-copy">
            <h1 class="card-title">Imágenes
            </h1>
            <p class="card-lead">
              Una pequeña selección de imagenes del lugar.
            </p>
            <a id="cta-recorrer" class="btn-primary" href="index.html">VOLVER ATRÁS</a>
          </div>

          <figure class="card-media">
            <img id="carouselImage" src="assets/images/Imagen-1.png" alt="AGUAMANIL/PÉLELAS" />
            <figcaption class="card-caption">
              <span class="caption-title" id="carouselCaption">AGUAMANIL/PÉLELAS</span>
              <span class="caption-counter" id="carouselCounter">1 / 10</span>
            </figcaption>
          </figure>
        </div>
      </section>
    </main>

  </div>

  <script>
    (function(){
      const toggle = document.getElementById('menuToggle');
      const menu = document.getElementById('floatingMenu');

      toggle.addEventListener('click', () => {
        const open = menu.classList.toggle('open');
        menu.setAttribute('aria-hidden', String(!open));
        toggle.setAttribute('aria-expanded', String(open));
        toggle.classList.toggle('open', open);
      });

      // Cerrar menú al tocar fuera
      document.addEventListener('click', (e) => {
        const isMobile = window.matchMedia('(max-width:1100px)').matches;
        if (!isMobile) return;
        if (!menu.classList.contains('open')) return;
        if (!menu.contains(e.target) && !toggle.contains(e.target)) {
          menu.classList.remove('open');
          menu.setAttribute('aria-hidden', 'true');
          toggle.classList.remove('open');
          toggle.setAttribute('aria-expanded', 'false');
        }
      });

      // Cerrar menú con Escape
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && menu.classList.contains('open')) {
          menu.classList.remove('open');
          menu.setAttribute('aria-hidden', 'true');
          toggle.classList.remove('open');
          toggle.setAttribute('aria-expanded', 'false');
        }
      });

      // Mantener el año si existe el elemento
      const yearEl = document.getElementById('year');
      if (yearEl) yearEl.textContent = new Date().getFullYear();
    })();
  </script>

  <!-- Carousel script: solo actúa sobre #carouselImage y su pie #carouselCaption,
       no modifica nada más -->
  <script>
  (function(){
    // --- Configuración: ruta de la imagen y su pie de foto ---
    const images = [
      { src:'assets/images/Imagen-1.png',  caption:'AGUAMANIL/PÉLELAS' },
      { src:'assets/images/Imagen-2.png',  caption:'LATA GALLETAS' },
      { src:'assets/images/Imagen-3.png',  caption:'VAJILLAS DE CERÁMICA FANALOZA' },
      { src:'assets/images/Imagen-4.png',  caption:'BIDONES LECHEROS' },
      { src:'assets/images/Imagen-5.png',  caption:'RADIOS' },
      { src:'assets/images/Imagen-6.png',  caption:'DAMAJUANAS/GARRAFAS Y CHUICAS' },
      { src:'assets/images/Imagen-7.png',  caption:'TELEVISORES DE TUBO' },
      { src:'assets/images/Imagen-8.png',  caption:'BÁSCULA DE COCINA' },
      { src:'assets/images/Imagen-9.png',  caption:'CUERDA PARA SALTAR Y PELOTA' },
      { src:'assets/images/Imagen-10.png', caption:'PORUÑAS' }
    ];

    const intervalMs = 2000;   // 2 segundos

    // Selecciona únicamente el elemento objetivo
    const imgEl = document.getElementById('carouselImage');
    if (!imgEl) return; // si no existe, no hace nada

    // Pie de foto y contador que acompañan a la imagen mostrada
    const capEl = document.getElementById('carouselCaption');
    const cntEl = document.getElementById('carouselCounter');

    // Mantener loading lazy por si no está
    imgEl.setAttribute('loading', 'lazy');

    // Preload para reducir parpadeos
    const preloaded = [];
    images.forEach(item => {
      const i = new Image();
      i.src = item.src;
      preloaded.push(i);
    });

    let index = 0;

    // Actualiza pie, contador y texto alternativo de la imagen en uso
    function updateCaption(item, position) {
      imgEl.alt = item.caption;
      if (capEl) capEl.textContent = item.caption;
      if (cntEl) cntEl.textContent = (position + 1) + ' / ' + images.length;
    }

    // Muestra una imagen junto con su pie y su texto alternativo
    function showNext() {
      // Solo actualiza src, alt y pie; no toca clases ni estructura
      const item = images[index];
      imgEl.src = item.src;
      updateCaption(item, index);
      index = (index + 1) % images.length;
    }

    // Inicializa con la primera entrada del array
    if (images.length > 0) {
      const first = images[0];
      if (imgEl.src.indexOf(first.src) === -1) {
        imgEl.src = first.src;
      }
      updateCaption(first, 0);
    }

    // Evita duplicar timers si el script se ejecuta más de una vez
    if (imgEl._carouselTimer) {
      clearInterval(imgEl._carouselTimer);
      imgEl._carouselTimer = null;
    }

    imgEl._carouselTimer = setInterval(showNext, intervalMs);

    // Zona de pausa: la tarjeta de imagen completa (foto + pie), porque el pie
    // tapa la parte baja de la foto
    const mediaEl = imgEl.closest('figure') || imgEl;

    // Pausa al hover (solo afecta a la tarjeta de imagen)
    mediaEl.addEventListener('mouseenter', () => {
      if (imgEl._carouselTimer) {
        clearInterval(imgEl._carouselTimer);
        imgEl._carouselTimer = null;
      }
    });
    mediaEl.addEventListener('mouseleave', () => {
      if (!imgEl._carouselTimer) {
        imgEl._carouselTimer = setInterval(showNext, intervalMs);
      }
    });

    // Limpieza al salir de la página
    window.addEventListener('beforeunload', () => {
      if (imgEl._carouselTimer) {
        clearInterval(imgEl._carouselTimer);
        imgEl._carouselTimer = null;
      }
    });
  })();
  </script>
<script src="scripts/nav-transition.js"></script>
</body>
</html>
