<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Cronograma — Museo de la vida rural El Canario</title>
  <meta name="description" content="Línea del tiempo del museo El Canario: la evolución de la vida rural y agrícola en Chile, contada a través de sus objetos." />
  <meta name="theme-color" content="#0e1813" />
  <link rel="icon" href="assets/svg/Logo.svg" type="image/svg+xml" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;700&family=Montserrat:wght@300;400;700;800;900&family=Lato:wght@400;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles/styles.css" />
  <script src="scripts/skeleton.js"></script>

  <!-- CSS de la línea del tiempo: puntos sobre la línea, detalle en cristal -->
  <style>
    /* ---------- Cabecera de la tarjeta: texto a la izquierda, botón a la derecha ---------- */
    .card-copy.tl-top { gap: 18px; }
    .tl-top .cc-text { flex: 1 1 auto; min-width: 0; }
    .tl-top .card-title { margin: 0; }
    .tl-top .card-lead { margin: 8px 0 0; max-width: 620px; }

    /* La tarjeta nunca queda "a ras": el hero guarda margen inferior aunque
       el detalle crezca con textos largos (styles.css no define padding-bottom). */
    .hero { padding-bottom: 32px; }

    /* Salvaguarda: en tablet y móvil no debe existir scroll horizontal.
       styles.css fuerza `overflow: auto` bajo 1100px y eso reactiva el eje X. */
    @media (max-width: 1100px) {
      html, body { overflow-x: clip !important; }
    }

    /* En escritorio la cabecera va en fila arriba y la línea usa todo el ancho */
    @media (min-width: 1101px) {
      .card-inner { flex-direction: column !important; }
      .card-copy.tl-top {
        flex: 0 0 auto !important;
        width: 100% !important;
        flex-direction: row !important;
        align-items: center !important;
        justify-content: space-between !important;
        gap: 24px !important;
        padding: 34px 36px 4px !important;
      }
      #cta-recorrer { margin-top: 0 !important; align-self: center !important; flex: 0 0 auto; }
    }

    /* ---------- Área de la línea: todo el ancho de la tarjeta ---------- */
    .tl-area {
      flex: 0 0 auto !important;
      width: 100% !important;
      min-width: 0;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 18px 30px 26px;
    }

    /* ---------- Miga de pan (breadcrumb) ---------- */
    .tl-crumb {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
      font-family: var(--light-sans);
      font-size: 13px;
      font-weight: 600;
      min-height: 24px;
    }
    .tl-crumb button {
      background: none;
      border: 0;
      padding: 3px 7px;
      margin: 0;
      cursor: pointer;
      font: inherit;
      color: var(--brand-green);
      border-radius: 7px;
      transition: color var(--transition), background var(--transition);
    }
    .tl-crumb button:hover { color: var(--accent); background: rgba(47,107,79,.08); }
    .tl-crumb .crumb-here { color: var(--ink); padding: 3px 7px; }
    .tl-crumb .crumb-sep { color: #9aa39a; }

    /* ---------- Escenario: los dos niveles superpuestos ---------- */
    .tl-stage {
      position: relative;
      flex: 1 1 auto;
      min-height: 430px;
      transition: min-height 320ms ease;
    }
    .tl-level {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      opacity: 0;
      visibility: hidden;
    }
    .tl-level.is-on {
      opacity: 1;
      visibility: visible;
    }

    /* ---------- Nivel 0: cabecera + línea maestra ---------- */
    .tl-master { margin-bottom: 16px; }
    /* ---------- Región desplazable (tablet y escritorios estrechos) ---------- */
    .tl-scroll {
      overflow-x: auto;
      overflow-y: hidden;
      -webkit-overflow-scrolling: touch;
      padding-bottom: 6px;
      scrollbar-width: thin;
      scrollbar-color: rgba(47,107,79,.4) transparent;
    }
    .tl-scroll::-webkit-scrollbar { height: 9px; }
    .tl-scroll::-webkit-scrollbar-thumb { background: rgba(47,107,79,.4); border-radius: 8px; }
    .tl-scroll::-webkit-scrollbar-track { background: transparent; }
    .tl-scroll:focus-visible { outline: 3px solid #f4c542; outline-offset: 3px; }

    /* ---------- Carril: base de posición de todos los elementos ---------- */
    .tl-rail { position: relative; width: 100%; box-sizing: border-box; }

    /* Transición de nivel: los puntos, títulos, fechas y cintas se esparcen
       hacia su lado de la línea (onda desde el centro) y luego entran con
       zoom. La línea (`.tl-rail::after` y los tramos `.tm-seg`) no se mueve.
       Cada elemento lleva `--tx` (centrado base), `--dx` (esparcerido) y
       `--dd` (retardo por distancia al centro). */
    .tl-rail.is-leaving > :not(.tm-seg) {
      animation: tl-leave 220ms cubic-bezier(.4, 0, .7, .2) both;
      animation-delay: var(--dd, 0s);
    }
    .tl-rail.is-entering > :not(.tm-seg) {
      animation: tl-enter 420ms cubic-bezier(.2, .7, .3, 1) both;
      animation-delay: var(--dd, 0s);
    }
    @keyframes tl-leave {
      to { opacity: 0; transform: translateX(calc(var(--tx, 0px) + var(--dx, 0px))) scale(.85); }
    }
    @keyframes tl-enter {
      from { opacity: 0; transform: translateX(calc(var(--tx, 0px) + var(--dx, 0px))) scale(1.25); }
      to { opacity: 1; transform: translateX(var(--tx, 0px)) scale(1); }
    }

    /* Horizontal: la línea verde de fondo */
    .tl-rail.h { height: 250px; }
    /* 210px: la línea maestra queda a la misma altura que en las épocas
       (44px de cabecera + 148.5px de carril en los dos niveles) */
    .tl-rail.h.tm { height: 210px; }
    .tl-rail.h::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 100px;
      height: 3px;
      border-radius: 3px;
      background: linear-gradient(90deg, rgba(47,107,79,.25), var(--brand-green) 12%, var(--brand-green) 88%, rgba(47,107,79,.25));
    }
    /* La línea maestra se dibuja con tramos del color de cada época */
    .tl-rail.h.tm::after { display: none; }
    .tm-seg {
      position: absolute;
      bottom: 60px;
      height: 3px;
      border-radius: 3px;
    }

    /* ---------- Punto sobre la línea ---------- */
    .tl-pt {
      --pt-lado: 17px;                 /* lado visible del punto */
      --pt-borde: 4px;                 /* aro de color */
      --hit: 1px;                      /* margen invisible de selección */
      position: absolute;
      bottom: 93px;
      width: var(--pt-lado);
      height: var(--pt-lado);
      padding: 0;
      border-radius: 50%;
      background: #fff;
      border: var(--pt-borde) solid var(--seg-bg, var(--brand-green));
      box-shadow: 0 2px 6px rgba(0,0,0,.22);
      --tx: -50%;                    /* centrado base (lo reutiliza la coreografía) */
      transform: translateX(var(--tx));
      cursor: pointer;
      box-sizing: border-box;
      overflow: visible;             /* el anillo de pulsación sale del botón */
      z-index: 4;
      transition: transform 200ms ease, box-shadow 200ms ease;
    }
    .tl-rail.tm .tl-pt { bottom: 53px; }
    /* Zona de selección invisible: un 10 % más grande que el punto visible
       (19px de área activa frente a los 17px que se ven). Así entra en la
       ventana con más holgura y cuesta más salirse de ella por error.
       Es un pseudo-elemento del propio botón: elementFromPoint devuelve el
       punto y :hover / mouseenter se activan igual que en su caja visible.
       --hit = 0 deja la zona exactamente del botón. */
    .tl-pt::before {
      content: "";
      position: absolute;
      inset: calc(-1 * (var(--pt-borde) + var(--hit)));
      border-radius: 50%;
    }
    .tl-pt:hover { transform: translateX(var(--tx)) scale(1.25); }
    .tl-pt.is-on {
      transform: translateX(var(--tx)) scale(1.3);
      box-shadow: 0 0 0 4px var(--pt-ring, rgba(47,107,79,.3)), 0 3px 8px rgba(0,0,0,.22);
    }
    .tl-pt:focus-visible { outline: 3px solid #f4c542; outline-offset: 3px; }

    /* ---------- Título del hito: horizontal, sobre el punto ---------- */
    .pt-title {
      position: absolute;
      font-family: var(--serif);
      font-weight: 700;
      font-size: 11.5px;
      color: #3a4a3d;
      white-space: nowrap;
      cursor: pointer;
      z-index: 3;
    }
    .pt-title.dm { --tx: -50%; transform: translateX(var(--tx)); }
    .pt-title:hover, .pt-title.is-on { color: var(--seg-text, var(--seg-bg, var(--brand-green))); }
    .tl-rail.h .pt-title.t1 { bottom: 116px; }
    .tl-rail.h .pt-title.t2 { bottom: 138px; }
    .tl-rail.tm .pt-title.t1 { bottom: 76px; }
    .tl-rail.tm .pt-title.t2 { bottom: 98px; }

    /* ---------- Fecha bajo el punto ---------- */
    .pt-date {
      position: absolute;
      font-family: var(--light-sans);
      font-weight: 700;
      font-size: 10.5px;
      letter-spacing: .3px;
      color: #5c665c;
      background: rgba(255,255,255,.92);
      border: 1px solid rgba(47,107,79,.28);
      padding: 3px 7px;
      border-radius: 7px;
      white-space: nowrap;
      cursor: pointer;
      box-sizing: border-box;
      z-index: 4;
    }
    .pt-date.dm { --tx: -50%; transform: translateX(var(--tx)); }
    .pt-date:hover { border-color: var(--brand-green); color: var(--brand-green); }
    .pt-date.is-on {
      background: var(--seg-bg, var(--brand-green));
      border-color: var(--seg-bg, var(--brand-green));
      color: var(--seg-ink, #fff);
    }
    /* Las fechas bajan 8px para dejar aire bajo el punto: así ni la pastilla
       ni su fila escalonada tocan el marcador (que al pasar el cursor crece). */
    .tl-rail.h .pt-date.d1 { bottom: 64px; }
    .tl-rail.h .pt-date.d2 { bottom: 40px; }
    .tl-rail.tm .pt-date.d1 { bottom: 24px; }
    .tl-rail.tm .pt-date.d2 { bottom: 0; }
    /* En la sublínea solo el punto es accionable: título y fecha son
       etiquetas (conservan su color al pasar el cursor). */
    #lvl1 .pt-title, #lvl1 .pt-date { cursor: default; }

    /* ---------- Cinta: proceso largo, no clicable ---------- */
    .tl-cinta {
      position: absolute;
      bottom: 12px;
      height: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 0 10px;
      border-radius: 8px;
      background: repeating-linear-gradient(-45deg, var(--seg-bg, var(--brand-green)) 0 9px, color-mix(in srgb, var(--seg-bg, var(--brand-green)) 84%, #fff) 9px 18px);
      color: var(--seg-ink, #fff);
      font-family: var(--light-sans);
      font-weight: 700;
      font-size: 11.5px;
      letter-spacing: .3px;
      box-shadow: 0 6px 14px rgba(0,0,0,.14);
      overflow: hidden;
      white-space: nowrap;
      box-sizing: border-box;
      z-index: 2;
    }
    .tl-cinta .cinta-range { font-weight: 400; opacity: .9; font-size: 10.5px; }
    .tl-cinta::before, .tl-cinta::after {
      content: "";
      position: absolute;
      top: 50%;
      width: 8px;
      height: 15px;
      margin-top: -7.5px;
      background: inherit;
      clip-path: polygon(0 0, 100% 50%, 0 100%);
    }
    .tl-cinta::before { left: -7px; transform: scaleY(.8); }
    .tl-cinta::after { right: -7px; transform: scaleX(-1) scaleY(.8); }

    /* ---------- Modo vertical (móvil ≤700px): la línea baja en el centro ---------- */
    .tl-rail.v { height: auto; padding: 14px 4px 18px; }
    .tl-rail.v::after {
      content: "";
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      top: 14px;
      bottom: 18px;
      width: 3px;
      border-radius: 3px;
      background: linear-gradient(180deg, rgba(47,107,79,.25), var(--brand-green) 12%, var(--brand-green) 88%, rgba(47,107,79,.25));
    }
    .vrow {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      padding: 4px 0;
      background: none;
      border: 0;
      font: inherit;
      color: inherit;
      text-align: left;
      cursor: pointer;
      box-sizing: border-box;
      position: relative;
      z-index: 2;
    }
    .vrow .vr-t {
      flex: 1 1 0;
      min-width: 0;
      text-align: right;
      font-family: var(--serif);
      font-weight: 700;
      font-size: 13px;
      line-height: 1.25;
      color: var(--ink);
    }
    .vrow .vr-c { flex: 0 0 34px; display: flex; align-items: center; justify-content: center; }
    .vrow .vr-y {
      flex: 1 1 0;
      min-width: 0;
      text-align: left;
      font-family: var(--light-sans);
      font-weight: 700;
      font-size: 10.5px;
      line-height: 1.3;
      color: #5c665c;
    }
    .vrow.vmaster .vr-t { font-size: 14px; }
    .vr-dot {
      display: block;
      width: 15px;
      height: 15px;
      border-radius: 50%;
      background: #fff;
      border: 4px solid var(--seg-bg, var(--brand-green));
      box-shadow: 0 2px 6px rgba(0,0,0,.2);
      box-sizing: border-box;
      transition: transform 200ms ease, box-shadow 200ms ease;
    }
    .vrow:hover .vr-dot { transform: scale(1.18); }
    .vrow.is-on .vr-dot {
      transform: scale(1.28);
      box-shadow: 0 0 0 4px var(--pt-ring, rgba(47,107,79,.3)), 0 2px 6px rgba(0,0,0,.2);
    }
    .vrow.is-on .vr-t { color: var(--seg-text, var(--seg-bg, var(--brand-green))); }
    .vrow:focus-visible { outline: 3px solid #f4c542; outline-offset: 2px; border-radius: 8px; }
    .vcinta {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      height: 26px;
      margin: 10px 0;
      padding: 0 10px;
      border-radius: 8px;
      background: repeating-linear-gradient(-45deg, var(--seg-bg, var(--brand-green)) 0 9px, color-mix(in srgb, var(--seg-bg, var(--brand-green)) 84%, #fff) 9px 18px);
      color: var(--seg-ink, #fff);
      font-family: var(--light-sans);
      font-weight: 700;
      font-size: 11px;
      letter-spacing: .3px;
      box-shadow: 0 6px 14px rgba(0,0,0,.14);
      position: relative;
      z-index: 2;
    }

    /* Pulsación de los puntos: avisa que son pulsables (móvil y escritorio) */
    .vr-dot { position: relative; }
    .vr-dot::after,
    .tl-pt::after {
      content: "";
      position: absolute;
      inset: -4px;
      border-radius: 50%;
      border: 2px solid var(--seg-bg, var(--brand-green));
      opacity: 0;
      animation: tl-pulse 2.2s ease-out infinite;
      pointer-events: none;
    }
    .tl-pt::after { animation-delay: var(--pulse-delay, 0s); }
    .vrow:nth-child(odd) .vr-dot::after { animation-delay: .5s; }
    .tl-rail.no-pulse .vr-dot::after,
    .tl-rail.no-pulse .tl-pt::after { animation: none; opacity: 0; }
    @keyframes tl-pulse {
      0% { transform: scale(.7); opacity: .75; }
      70% { transform: scale(2); opacity: 0; }
      100% { transform: scale(2); opacity: 0; }
    }
    /* ---------- Cabecera de nivel: la línea queda siempre a la misma altura ---------- */
    .tl-band-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 6px;
      height: 44px;                  /* fija: mide lo mismo en nivel 0 y 1 */
      overflow: hidden;
      white-space: nowrap;           /* nunca envuelve: no descuadra la línea */
    }
    .tl-band-head h2 {
      font-family: var(--serif);
      font-size: clamp(18px, 2.4vw, 23px);
      margin: 0;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--ink);   /* heredaba el blanco de .hero y no se veía */
    }
    .tl-band-head .band-range {
      font-family: var(--light-sans);
      font-size: 12.5px;
      color: #5c665c;
      min-width: 0;
      flex: 0 1 auto;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ---------- Detalle: tarjeta de color sólido + panel de cristal ---------- */
    .tl-slot { flex: 0 0 auto; }
    .tl-detail {
      display: flex;
      width: 100%;
      box-sizing: border-box;
      border-radius: 18px;
      overflow: hidden;
      position: relative;
      z-index: 5;                /* el detalle tapa la línea en móvil */
      /* el mismo tipo de fondo que el menú fijo, para que el cristal difumine de verdad */
      background:
        linear-gradient(rgba(14, 24, 19, .62), rgba(14, 24, 19, .62)),
        url('assets/images/Menu-fondo.webp') center 32% / cover no-repeat;
      scroll-margin-top: calc(var(--header-height) + 18px);
      scroll-margin-bottom: 24px;     /* al abrir textos largos no queda pegado al borde */
    }
    .tl-detail:empty { display: none; }
    .tl-detail.is-hint { background: none; overflow: visible; border-radius: 0; }
    .det-card {
      flex: 0 0 30%;
      min-width: 220px;
      box-sizing: border-box;
      padding: 18px 20px;
      color: var(--seg-ink, #fff);
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 6px;
      background: var(--seg-bg, var(--brand-green));
    }
    .det-kicker {
      font-family: var(--light-sans);
      font-weight: 700;
      font-size: 10.5px;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      opacity: .85;
    }
    .det-date { font-family: var(--serif); font-weight: 700; font-size: clamp(24px, 3vw, 34px); line-height: 1; }
    .det-title { font-family: var(--serif); font-weight: 700; font-size: 16.5px; line-height: 1.25; }
    .det-glass {
      position: relative;
      flex: 1 1 auto;
      min-width: 0;
      min-height: 0;                /* respeta el alto máximo de la ventana */
      display: flex;
      flex-direction: column;
      box-sizing: border-box;
      padding: 18px 46px 18px 20px;
      color: #fff;
      border-radius: 0 18px 18px 0;
      background: rgba(14, 24, 19, .42);
      -webkit-backdrop-filter: blur(16px) saturate(140%);
      backdrop-filter: blur(16px) saturate(140%);
      border: 1px solid rgba(255, 255, 255, .20);
    }
    /* Con la ventana limitada en alto, el texto se desplaza dentro de ella */
    .det-text {
      font-family: var(--light-sans);
      font-size: 14.5px;
      line-height: 1.65;
      min-height: 0;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: rgba(255,255,255,.35) transparent;
    }
    .det-text::-webkit-scrollbar { width: 8px; }
    .det-text::-webkit-scrollbar-thumb { background: rgba(255,255,255,.35); border-radius: 8px; }
    .det-text::-webkit-scrollbar-track { background: transparent; }
    .det-text p { margin: 0 0 10px; }
    .det-text p:last-child { margin-bottom: 0; }
    .det-text ul, .det-text ol { margin: 0 0 10px; padding-left: 18px; }
    .det-text li { margin: 0 0 4px; }
    .det-x {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 30px;
      height: 30px;
      padding: 0;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,.35);
      background: rgba(255,255,255,.08);
      color: #fff;
      font-size: 17px;
      line-height: 1;
      cursor: pointer;
      display: grid;
      place-items: center;
    }
    .det-x:hover { background: rgba(255,255,255,.2); }
    .det-x:focus-visible { outline: 3px solid #f4c542; outline-offset: 2px; }
    /* Escritorio con cursor: la ventana se abre al pasar el puntero sobre
       el punto y se cierra al quitarlo (como en cruce.html), así que la ×
       de cierre desaparece. En móvil y en pantallas táctiles sigue siendo
       el cierre principal. */
    @media (min-width: 701px) and (hover: hover) {
      .det-x { display: none; }
    }

    /* Pista: texto breve y discreto, sin caja (solo en escritorio) */
    .det-hint {
      padding: 8px 2px 0;
      color: #9aa39a;
      font-family: var(--light-sans);
      font-weight: 600;
      font-size: 12px;
      letter-spacing: .3px;
    }

    /* ---------- Responsive ---------- */
    @media (max-width: 1100px) {
      .tl-area {
        order: 3;                    /* tras .card-copy (order 2): texto arriba, línea abajo */
        padding: 16px 14px 18px;
        background: #ffffff;
        border-radius: var(--radius);
        box-shadow: 0 18px 40px rgba(0,0,0,.12);
      }
      .tl-rail.h { height: 260px; }
      /* misma regla de igualdad: línea a 158.5px del carril en los dos niveles */
      .tl-rail.h.tm { height: 220px; }
      .tl-detail { flex-direction: column; }
      .det-card { flex: 0 0 auto; min-width: 0; }
      .det-glass { padding: 16px 44px 16px 18px; border-radius: 0 0 18px 18px; }
    }
    @media (max-width: 700px) {
      .tl-scroll { overflow: visible; padding-bottom: 0; }
      .tl-area { padding: 14px 12px 16px; }
      .tl-band-head h2 { font-size: 19px; }
      .vrow .vr-t { font-size: 12.5px; }
      .vrow.vmaster .vr-t { font-size: 13.5px; }
      .det-card { padding: 16px 18px; }
    }

    /* ---------- Pantallas bajas: la línea sube dentro de la tarjeta ---------- */
    /* Cuando la ventana de la pantalla no da para la línea + la ventana
       emergente, se comprime la cabecera (hueco del botón, cabecera de la
       época y alto del carril) para que la línea quede más arriba y la
       ventana quepa POR DEBAJO sin desplazar la página: el punto se queda
       bajo el cursor. Nivel 0 y nivel 1 bajan exactamente lo mismo (se
       mantienen los 40px de diferencia de carril), así la línea sigue a la
       misma altura en los dos niveles. */
    @media (max-height: 780px) {

    /* =====================================================================
       UTILIDADES
       ===================================================================== */
    var $ = function (id) { return document.getElementById(id); };

    // Formato de año: negativo → a.C.
    function yr(n) {
      if (n < 0) return Math.abs(n).toLocaleString('es-CL') + ' a.C.';
      return String(n);
    }
    function el(tag, cls, txt) {
      var e = document.createElement(tag);
      if (cls) e.className = cls;
      if (txt != null) e.textContent = txt;
      return e;
    }
    function clamp01(x) { return x < 0 ? 0 : (x > 1 ? 1 : x); }
    // '#2F6B4F' → 'rgba(47,107,79,.3)' (anillo del punto activo)
    function hexA(hex, a) {
      var h = String(hex).replace('#', '');
      if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
      var n = parseInt(h, 16);
      return 'rgba(' + ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')';
    }
    // Nombre corto del hito para la etiqueta sobre el punto
    function shortOf(s) { return s.label || s.name || s.title || s.yr; }

    /* =====================================================================
       CONTRASTE POR COLOR DE ÉPOCA
       lumOf: luminancia relativa (WCAG). inkOf: color de texto sobre el
       color de la época (blanco, o tinta oscura si el color es claro).
       textOnWhite: el color de la época como texto sobre blanco (se
       oscurece hasta los 4.5:1 para hover/selección legibles).
       ===================================================================== */
    function hexRgb(hex) {
      var h = String(hex).replace('#', '');
      if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
      return [parseInt(h.substr(0, 2), 16), parseInt(h.substr(2, 2), 16), parseInt(h.substr(4, 2), 16)];
    }
    function lumRgb(c) {
      var v = c.map(function (x) {
        x = x / 255;
        return x <= 0.04045 ? x / 12.92 : Math.pow((x + 0.055) / 1.055, 2.4);
      });
      return 0.2126 * v[0] + 0.7152 * v[1] + 0.0722 * v[2];
    }
    function lumOf(hex) { return lumRgb(hexRgb(hex)); }
    function inkOf(hex) { return lumOf(hex) > 0.2 ? '#101a12' : '#ffffff'; }
    function textOnWhite(hex) {
      var c = hexRgb(hex), guard = 0;
      while (lumRgb(c) > 0.183 && guard++ < 50) {
        c = c.map(function (x) { return x * 0.93; });
      }
      return '#' + c.map(function (x) {
        var h = Math.round(Math.max(0, Math.min(255, x))).toString(16);
        return h.length < 2 ? '0' + h : h;
      }).join('');
    }

    /* Coreografía de cambio de nivel: cada elemento lleva su dirección de
       esparcerido (--dx, hacia su lado de la línea) y su retardo por
       distancia al centro (--dd, la onda). */
    function choreo(node, t) {
      node.style.setProperty('--dx', ((t - 0.5) * 180).toFixed(1) + 'px');
      node.style.setProperty('--dd', (Math.abs(t - 0.5) * 0.16).toFixed(3) + 's');
    }

    /* Margen interior del carril: ningún punto ni etiqueta toca el borde
       (corrige el recorte del punto de 1492 en el extremo izquierdo). */
    var PAD = 16;
    function posL(t) { return 'calc(' + PAD + 'px + (100% - ' + (PAD * 2) + 'px) * ' + (+t).toFixed(5) + ')'; }

    var mQ = window.matchMedia('(max-width: 700px)');
    function isVert() { return mQ.matches; }
    var reduceMQ = window.matchMedia('(prefers-reduced-motion: reduce)');
    function noMotion() { return reduceMQ.matches; }

    /* Modo escritorio con cursor (misma convención que cruce.html: ancho
       >700px y dispositivo apuntador): las ventanas emergentes se abren al
       entrar el puntero en un punto y se cierran al quitarlo. */
    var hoverMQ = window.matchMedia('(hover: hover)');
    function isHoverMode() { return !isVert() && hoverMQ.matches; }

    /* Tramos de la línea maestra: proporcionales a la duración de cada
       época, con un mínimo del 8% para que las épocas cortas no se fundan
       en el extremo derecho. No es matemáticamente perfecto: basta con
       que se note la distancia entre épocas. */
    var MIN_TRAMO = 8;
    var TRAMOS = (function () {
      var durs = BANDS.map(function (b) { return Math.max(1, b.to - b.from); });
      var total = durs.reduce(function (a, c) { return a + c; }, 0);
      var w = durs.map(function (d) { return (d / total) * 100; });
      var deficit = 0, pool = 0;
      w.forEach(function (v) { if (v < MIN_TRAMO) deficit += MIN_TRAMO - v; });
      w.forEach(function (v) { if (v > MIN_TRAMO) pool += v; });
      if (pool > 0) {
        w = w.map(function (v) { return v > MIN_TRAMO ? v - deficit * (v / pool) : MIN_TRAMO; });
      }
      var acc = 0;
      return w.map(function (v) {
        var tr = { start: acc / 100, frac: v / 100 };
        acc += v;
        return tr;
      });
    })();

    // Posición (0–1) del hito dentro de su época
    function segT(b, s) {
      var span = b.to - b.from;
      if (s.type === 'event') return clamp01((s.at - b.from) / span);
      return clamp01((((s.from + s.to) / 2) - b.from) / span);
    }
    /* =====================================================================
       ELEMENTOS Y ESTADO
       ===================================================================== */
    var crumb = $('tlCrumb'),
        lvl = [$('lvl0'), $('lvl1')],
        masterBox = $('tlMaster'),
        rail = $('tlRail'),
        scroll = $('tlScroll'),
        bandTitle = $('bandTitle'),
        bandRange = $('bandRange'),
        detail = $('tlDetail'),
        slot = $('tlSlot'),
        stage = $('tlStage');

    var state = { level: 0, band: -1, seg: -1 };
    var vistas = {};     // hitos cuya ventana ya se abrió en la sublínea actual
    var xy = { x: -1, y: -1 }; // última posición real del puntero
    var tCierre = 0;     // temporizador del cierre diferido
    var segPendiente = -1; // ventana abierta al programar un cierre
    var rowEls = [];   // filas verticales por índice de hito
    var ptEls = [];    // punto + título + fecha (modo horizontal) por índice
    var pulsed = false; // tras el primer toque, la pulsación no vuelve
    var animTok = 0;    // testigo: solo la corredera más reciente manda
    var swapping = false; // cambio de nivel en curso (bloquea navegación)

    /* =====================================================================
       NIVEL 0 — línea maestra de las 5 épocas
       ===================================================================== */
    function renderMaster() {
      masterBox.innerHTML = '';

      // Móvil: la línea maestra baja en vertical
      if (isVert()) {
        var vr = el('div', 'tl-rail v tm' + (pulsed ? ' no-pulse' : ''));
        var VH = 500, prevT = null;
        BANDS.forEach(function (b, i) {
          var t = TRAMOS[i].start + TRAMOS[i].frac / 2;
          var range = yr(b.from) + ' — ' + yr(b.to);
          var row = buildRow(b.name, range, b.color, b.name + ', ' + range,
            function () { goBand(i); });
          row.classList.add('vmaster');
          choreo(row, t);
          var gap = prevT === null
            ? Math.round(t * VH - 23)
            : Math.round((t - prevT) * VH - 46);
          row.style.marginTop = Math.max(6, gap) + 'px';
          prevT = t;
          vr.appendChild(row);
        });
        masterBox.appendChild(vr);
        return;
      }

      // Escritorio: tramos de color proporcionales con los 5 puntos
      var sc = el('div', 'tl-scroll');
      sc.tabIndex = 0;
      sc.setAttribute('role', 'region');
      sc.setAttribute('aria-label', 'Línea general de épocas, desplazable en horizontal');
      var r = el('div', 'tl-rail h tm' + (pulsed ? ' no-pulse' : ''));

      // Antes de dibujar: tamaños y filas escalonadas de títulos y fechas
      var titles = [], dates = [];
      TRAMOS.forEach(function (tr, i) {
        var b = BANDS[i];
        titles.push({ t: tr.start + tr.frac / 2, f: b.name.length * 6.3 });
        dates.push({
          t: tr.start + tr.frac / 2,
          f: (yr(b.from) + ' — ' + yr(b.to)).length * 6 + 16
        });
      });
      var refW = masterBox.clientWidth || scroll.clientWidth || 1000;
      var tRows = assignRows(titles, refW);
      var dRows = assignRows(dates, refW);

      TRAMOS.forEach(function (tr, i) {
        var b = BANDS[i];
        var range = yr(b.from) + ' — ' + yr(b.to);
        var t = tr.start + tr.frac / 2;

        var seg = el('div', 'tm-seg');
        seg.style.background = b.color;
        seg.style.left = posL(tr.start);
        seg.style.width = 'calc((100% - ' + (PAD * 2) + 'px) * ' + tr.frac.toFixed(5) + ' - 2px)';
        r.appendChild(seg);

        var pick = function () { goBand(i); };

        var dot = el('button', 'tl-pt');
        dot.type = 'button';
        dot.style.left = posL(t);
        dot.style.setProperty('--seg-bg', b.color);
        dot.style.setProperty('--pt-ring', hexA(b.color, .3));
        dot.style.setProperty('--pulse-delay', i % 2 ? '.5s' : '0s');
        dot.setAttribute('aria-label', b.name + ', ' + range);
        dot.addEventListener('click', pick);
        choreo(dot, t);
        r.appendChild(dot);

        // Nombre de la época sobre el punto, escalonado donde choca
        var tt = el('span', 'pt-title t' + (tRows[i] + 1));
        tt.style.setProperty('--seg-bg', b.color);
        tt.style.setProperty('--seg-text', textOnWhite(b.color));
        tt.textContent = b.name;
        edgePos(tt, t);
        tt.addEventListener('click', pick);
        choreo(tt, t);
        r.appendChild(tt);

        // Fechas debajo de la línea
        var dd = el('span', 'pt-date d' + (dRows[i] + 1));
        dd.style.setProperty('--seg-bg', b.color);
        dd.textContent = range;
        edgePos(dd, t);
        dd.addEventListener('click', pick);
        choreo(dd, t);
        r.appendChild(dd);
      });

      r.style.minWidth = railWidth(titles, tRows, dates, dRows) + 'px';
      sc.appendChild(r);
      masterBox.appendChild(sc);
    }

    /* =====================================================================
       ETIQUETAS EN HORIZONTAL: POSICIÓN Y FILAS ESCALONADAS
       Títulos y fechas van horizontales sobre el punto. Cada etiqueta ocupa
       la fila más cercana a la línea; si chocaría con la anterior, sube a la
       segunda fila. Con las filas ya asignadas se calcula el ancho mínimo
       del carril para que no se solapen (si no cabe, la línea desplaza).
       ===================================================================== */
    function edgePos(node, t) {
      // Centrado en el punto (con translateX(-50%)); solo el extremo
      // izquierdo se ancla a la izquierda para no salirse de la línea.
      // Cerca del borde derecho también se centra: anclado a la derecha,
      // título y fecha quedaban desfasados a la izquierda de su punto.
      if (t <= 0.05) { node.style.left = posL(t); node.classList.add('ds'); }
      else { node.style.left = posL(t); node.classList.add('dm'); }
    }
    function assignRows(items, refW) {
      var ends = [-1, -1];        // extremo derecho (en t) de cada fila
      var margin = 12 / refW;     // 12 px de aire mínimo entre etiquetas
      return items.map(function (p) {
        var fw = p.f / refW;
        var L = (p.t <= 0.05) ? 0 : (p.t >= 0.95 ? fw : fw / 2);
        var R = (p.t <= 0.05) ? fw : (p.t >= 0.95 ? 0 : fw / 2);
        var row = (p.t - L < ends[0] + margin) ? 1 : 0;
        ends[row] = Math.max(ends[row], p.t + R);
        return row;
      });
    }
    function rowsNeed(items, rows) {
      var need = 0;
      [0, 1].forEach(function (r) {
        var idxs = [];
        items.forEach(function (_, i) { if (rows[i] === r) idxs.push(i); });
        for (var k = 1; k < idxs.length; k++) {
          var a = items[idxs[k - 1]], b = items[idxs[k]];
          var gap = b.t - a.t;
          if (gap < 0.004) gap = 0.004;
          var aR = a.t >= 0.95 ? 0 : (a.t <= 0.05 ? a.f : a.f / 2);
          var bL = b.t <= 0.05 ? 0 : (b.t >= 0.95 ? b.f : b.f / 2);
          need = Math.max(need, (aR + bL + 16) / gap);
        }
      });
      return need;
    }
    function railWidth(titles, tRows, dates, dRows) {
      var w = Math.max(rowsNeed(titles, tRows), rowsNeed(dates, dRows));
      return Math.max(700, Math.min(Math.ceil(w), 1780));
    }

    /* =====================================================================
       NIVEL 1 — línea de una época con sus hitos
       ===================================================================== */
    function renderBand(i) {
      var b = BANDS[i];
      bandTitle.textContent = b.name;
      bandRange.textContent = yr(b.from) + ' — ' + yr(b.to);
      // Los elementos viejos se tiran sin mandar mouseleave: se cancela el
      // cierre pendiente para no cerrar una ventana que ya no existe.
      clearTimeout(tCierre); tCierre = 0; segPendiente = -1;
      rowEls = [];
      ptEls = [];
      rail.innerHTML = '';
      rail.style.minWidth = '';
      rail.className = 'tl-rail ' + (isVert() ? 'v' : 'h') + (pulsed ? ' no-pulse' : '');
      rail.style.setProperty('--seg-bg', b.color);
      rail.style.setProperty('--seg-ink', inkOf(b.color));
      rail.style.setProperty('--seg-text', textOnWhite(b.color));
      if (isVert()) renderBandV(b);
      else renderBandH(b);
      scroll.scrollLeft = 0;
    }

    // Escritorio/tablet: todo en horizontal sobre la línea
    function renderBandH(b) {
      var span = b.to - b.from;

      // Los hitos (no las cintas) primero, para medirlos y escalonarlos
      var pts = [];
      b.segs.forEach(function (s, idx) {
        if (s.type === 'cinta') return;
        pts.push({ s: s, idx: idx, t: segT(b, s) });
      });

      // Tamaños y filas escalonadas de títulos y fechas
      var titles = pts.map(function (p) { return { t: p.t, f: shortOf(p.s).length * 6.3 }; });
      var dates = pts.map(function (p) { return { t: p.t, f: p.s.yr.length * 6 + 16 }; });
      var refW = scroll.clientWidth || 1000;
      var tRows = assignRows(titles, refW);
      var dRows = assignRows(dates, refW);
      var tOf = {}, dOf = {};
      pts.forEach(function (p, k) { tOf[p.idx] = tRows[k]; dOf[p.idx] = dRows[k]; });

      var kn = 0; // alterna el retardo de pulsación de los puntos
      b.segs.forEach(function (s, idx) {
        if (s.type === 'cinta') {
          var c = el('div', 'tl-cinta');
          c.style.setProperty('--seg-bg', s.color || b.color);
          c.style.left = posL(clamp01((s.from - b.from) / span));
          c.style.width = 'calc((100% - ' + (PAD * 2) + 'px) * ' + ((s.to - s.from) / span).toFixed(5) + ')';
          c.title = s.name + ' (' + s.range + '). ' + s.note;
          c.appendChild(el('span', null, s.name));
          c.appendChild(el('span', 'cinta-range', s.range));
          choreo(c, clamp01((((s.from + s.to) / 2) - b.from) / span));
          rail.appendChild(c);
          return; // la cinta no es clicable
        }

        var t = segT(b, s);
        // Solo el punto abre la ventana: el título y la fecha dan su color al
        // pasar el cursor, pero no accionan el detalle (abajo, en hoverPunto).
        // `e.detail` distingue el clic del ratón (0 = teclado).
        var pick = function (e) {
          selectSeg(idx, isHoverMode() && !!(e && e.detail));
        };
        var aria = s.title + ', ' + (s.range || s.yr);

        var dot = el('button', 'tl-pt');
        dot.type = 'button';
        dot.style.left = posL(t);
        dot.style.setProperty('--seg-bg', b.color);
        dot.style.setProperty('--pt-ring', hexA(b.color, .3));
        dot.style.setProperty('--pulse-delay', kn++ % 2 ? '.5s' : '0s');
        dot.setAttribute('aria-label', aria);
        dot.addEventListener('click', pick);
        choreo(dot, t);
        rail.appendChild(dot);

        var tt = el('span', 'pt-title t' + (tOf[idx] + 1));
        tt.style.setProperty('--seg-bg', b.color);
        tt.textContent = shortOf(s);
        edgePos(tt, t);
        choreo(tt, t);
        rail.appendChild(tt);

        var dd = el('span', 'pt-date d' + (dOf[idx] + 1));
        dd.style.setProperty('--seg-bg', b.color);
        dd.textContent = s.yr;
        edgePos(dd, t);
        choreo(dd, t);
        rail.appendChild(dd);

        // Escritorio con cursor: solo el punto abre la ventana
        if (isHoverMode()) hoverPunto(dot, idx);

        ptEls[idx] = { dot: dot, title: tt, date: dd };
      });

      rail.style.minWidth = railWidth(titles, tRows, dates, dRows) + 'px';
    }

    // Móvil: la línea baja en el centro; título a la izquierda y fecha a la derecha
    function renderBandV(b) {
      var span = b.to - b.from;
      var VH = 640, prevT = null;

      b.segs.forEach(function (s, idx) {
        if (s.type === 'cinta') {
          var c = el('div', 'vcinta');
          c.style.setProperty('--seg-bg', s.color || b.color);
          c.title = s.name + ' (' + s.range + '). ' + s.note;
          c.appendChild(el('span', null, s.name));
          c.appendChild(el('span', 'cinta-range', s.range));
          choreo(c, clamp01((((s.from + s.to) / 2) - b.from) / span));
          rail.appendChild(c);
          return;
        }

        var t = segT(b, s);
        // Móvil: con una ventana abierta, tocar otra fila la sustituye (se
        // cierra la actual y se abre la clickeada); tocar la misma la cierra.
        var row = buildRow(shortOf(s), s.yr, b.color, s.title + ', ' + (s.range || s.yr),
          function () {
            if (state.seg >= 0 && state.seg === idx) closeDetail();
            else selectSeg(idx);
          });
        var gap = prevT === null
          ? Math.round(t * VH - 23)
          : Math.round((t - prevT) * VH - 46);
        row.style.marginTop = Math.max(6, gap) + 'px';
        prevT = t;
        choreo(row, t);
        rail.appendChild(row);
        rowEls[idx] = row;
      });

      rail.style.minWidth = '';
    }

    // Fila del modo vertical: título · punto · fecha
    function buildRow(title, dateTxt, color, ariaLabel, onPick) {
      var row = el('button', 'vrow');
      row.type = 'button';
      row.style.setProperty('--seg-bg', color);
      row.style.setProperty('--seg-text', textOnWhite(color));
      row.style.setProperty('--pt-ring', hexA(color, .3));
      row.setAttribute('aria-label', ariaLabel);
      row.appendChild(el('span', 'vr-t', title));
      var c = el('span', 'vr-c');
      c.appendChild(el('span', 'vr-dot'));
      row.appendChild(c);
      row.appendChild(el('span', 'vr-y', dateTxt));
      row.addEventListener('click', onPick);
      return row;
    }
    /* =====================================================================
       SELECCIÓN DE UN HITO Y DETALLE
       ===================================================================== */
    /* Scroll automático hacia la ventana abierta: 'nearest' solo desplaza la
       pantalla si no cabe entera (si ya se ve completa, no mueve nada).
       `delay` pospone la medición: en escritorio el escenario sigue creciendo
       (transición de min-height, 320 ms) y medir antes deja el scroll corto. */
    function scrollToDetail(delay) {
      var go = function () {
        if (detail.scrollIntoView) {
          detail.scrollIntoView({ block: 'nearest', behavior: noMotion() ? 'auto' : 'smooth' });
        }
      };
      if (delay) { setTimeout(go, delay); } else { go(); }
    }

    function selectSeg(si, fijo) {
      if (swapping) return;
      state.seg = si;
      vistas[si] = true; // ya se ha visto esta ventana de la sublínea
      if (!pulsed) { pulsed = true; rail.classList.add('no-pulse'); }
      markSeg();
      applyDetail();
      syncStage();
      renderCrumb();
      if (fijo) {
        // Apertura por puntero (hover): sin scroll automático, para que el
        // punto se quede bajo el cursor. El scroll sigue existiendo en
        // móvil y al abrir con teclado o clic.
      } else if (isVert()) {
        // Corredera: el scroll va cuando la ventana ya mide su altura final
        animateOpen(scrollToDetail);
      } else {
        // Escritorio: la ventana se abre a su tamaño final, pero el escenario
        // sigue creciendo; se mide cuando asiente para que la pantalla no
        // quede corta. Con movimiento reducido no hay transición: al instante.
        scrollToDetail(noMotion() ? 0 : 420);
      }
    }

    // Abre el detalle animando su altura (corredera vertical suave).
    // `after` se ejecuta cuando la ventana ya mide su altura final.
    function animateOpen(after) {
      if (noMotion()) { if (after) after(); return; }
      var target = detail.offsetHeight;
      if (!target) { if (after) after(); return; }
      var my = ++animTok;
      detail.style.height = '0px';
      detail.style.overflow = 'hidden';
      void detail.offsetHeight; // reflow: partir de 0
      detail.style.transition = 'height 320ms ease';
      detail.style.height = target + 'px';
      var done = function (e) {
        if (e && e.propertyName && e.propertyName !== 'height') return;
        detail.removeEventListener('transitionend', done);
        clearTimeout(backup);
        if (my !== animTok) return; // una animación más reciente mandó
        detail.style.height = '';
        detail.style.overflow = '';
        detail.style.transition = '';
        if (after) after(); // altura final: ya se puede hacer scroll
      };
      var backup = setTimeout(done, 420); // respaldo si no llega transitionend
      detail.addEventListener('transitionend', done);
    }

    function markSeg() {
      var i, on;
      for (i = 0; i < ptEls.length; i++) {
        if (!ptEls[i]) continue;
        on = (i === state.seg);
        ptEls[i].dot.classList.toggle('is-on', on);
        ptEls[i].dot.setAttribute('aria-expanded', on ? 'true' : 'false');
        ptEls[i].title.classList.toggle('is-on', on);
        ptEls[i].date.classList.toggle('is-on', on);
      }
      for (i = 0; i < rowEls.length; i++) {
        if (!rowEls[i]) continue;
        on = (i === state.seg);
        rowEls[i].classList.toggle('is-on', on);
        rowEls[i].setAttribute('aria-expanded', on ? 'true' : 'false');
      }
    }

    /* =====================================================================
       VENTANAS POR HOVER (ESCRITORIO CON CURSOR)
       ===================================================================== */
    /* Solo el punto abre la ventana. El título y la fecha cambian de color
       al pasar el cursor, pero no la accionan. */
    function hoverPunto(dot, idx) {
      dot.addEventListener('mouseenter', function () {
        // `fijo` = apertura por puntero: no se hace scroll automático, para
        // que el punto siga justo debajo del cursor.
        if (state.seg !== idx) selectSeg(idx, true);
      });
    }

    // ¿Qué hay bajo el cursor AHORA MISMO? Se le pregunta al DOM en la
    // posición actual del puntero, nunca a un mouseleave: si la página se
    // desplaza bajo un ratón quieto, el punto se mueve de sitio pero el
    // puntero no "sale" de él, así que la ventana no se cierra sola.
    function bajoPuntero(x, y) {
      if (x < 0 || y < 0) return false;
      var n = document.elementFromPoint(x, y);
      if (!n) return false;
      return !!(n.closest('.tl-detail') || n.closest('.tl-pt') ||
                n.closest('.pt-title') || n.closest('.pt-date'));
    }

    // Cierra la ventana comprobando la posición real del puntero 80 ms
    // después (margen que evita el parpadeo al saltar de una pieza a otra).
    // Solo se programa desde `mousemove`: el scroll por sí solo no la cierra.
    function programarCierre() {
      clearTimeout(tCierre);
      if (state.seg < 0 || !isHoverMode()) return;
      segPendiente = state.seg;
      tCierre = setTimeout(function () {
        tCierre = 0;
        if (state.seg < 0 || state.seg !== segPendiente) return;
        if (bajoPuntero(xy.x, xy.y)) return;
        closeDetail(true);
      }, 80);
    }

    // El puntero manda: su posición real se guarda en `xy` y, con ella,
    // se decide si la ventana sigue abierta o se cierra.
    document.addEventListener('mousemove', function (e) {
      xy.x = e.clientX;
      xy.y = e.clientY;
      if (state.seg >= 0 && isHoverMode()) programarCierre();
    });
    // Al salir del documento (cambio de ventana, pestaña…): se cierra.
    document.addEventListener('mouseleave', function () {
      xy.x = -1; xy.y = -1;
      if (state.seg >= 0 && isHoverMode()) closeDetail(true);
    });

    // Sin × en escritorio: Escape también cierra la ventana abierta
    document.addEventListener('keydown', function (e) {
      if (e.key !== 'Escape' && e.keyCode !== 27) return;
      if (state.seg < 0 || swapping) return;
      closeDetail();
    });

    // Tarjeta de color sólido (fecha + título) + panel de cristal (texto)
    function applyDetail() {
      animTok++; // anula cualquier corredera en curso (su cierre ya no actúa)
      if (state.seg < 0) {
        detail.style.removeProperty('--seg-bg');
        detail.style.removeProperty('--seg-ink');
        if (isVert()) {
          // En móvil no hay pista de texto: los puntos pulsan hasta el primer toque
          detail.className = 'tl-detail';
          detail.innerHTML = '';
        } else {
          detail.className = 'tl-detail is-hint';
          detail.innerHTML = '<div class="det-hint">Acércate a un punto de la línea</div>';
        }
      } else {
        var b = BANDS[state.band], s = b.segs[state.seg];
        detail.className = 'tl-detail';
        detail.style.height = '';
        detail.style.overflow = '';
        detail.style.transition = '';
        detail.style.setProperty('--seg-bg', b.color);
        detail.style.setProperty('--seg-ink', inkOf(b.color));
        detail.innerHTML =
          '<div class="det-card">' +
            '<span class="det-kicker">' + b.name + '</span>' +
            '<span class="det-date">' + (s.range || s.yr) + '</span>' +
            '<span class="det-title">' + s.title + '</span>' +
          '</div>' +
          '<div class="det-glass">' +
            '<button type="button" class="det-x" aria-label="Cerrar el detalle">×</button>' +
            '<div class="det-text">' + s.body + '</div>' +
          '</div>';
        var x = detail.querySelector('.det-x');
        if (x) x.addEventListener('click', function () { closeDetail(); });
      }
      placeDetail();
    }

    // En escritorio el detalle queda bajo la línea; en móvil se despliega
    // justo debajo del punto tocado y la línea continúa.
    /* En pantallas bajas la ventana no cabe entera por debajo de la línea:
       1) si casi cabe, se limita su alto al hueco y el texto se desplaza
          dentro (la ventana se ve completa sin mover la página);
       2) si ni siquiera eso, se pone EN el hueco de encima de la línea.
       En los dos casos nada se desplaza: el punto se queda bajo el cursor. */
    function fitDetail() {
      // Se vuelve a la posición normal (debajo de la línea) para medir
      detail.classList.remove('det-arriba');
      detail.style.removeProperty('max-height');
      detail.style.removeProperty('top');
      if (isVert() || state.seg < 0) return;

      var natural = detail.offsetHeight;   // alto que tendría sin tope
      var punto = ptEls[state.seg] && ptEls[state.seg].dot;
      if (!punto) return;
      var lvl = detail.closest('.tl-level') || detail.parentNode;
      var lvlTop = lvl.getBoundingClientRect().top;
      var bajo = Math.round(window.innerHeight - detail.getBoundingClientRect().top - 16);

      if (bajo >= natural) return;         // cabe por debajo: sin tope

      if (bajo >= 100) {                   // cabe casi: se limita su alto
        detail.style.maxHeight = bajo + 'px';
        return;
      }

      // No cabe por debajo: se pone encima de la línea, dejando el punto a
      // la vista. Se limita su alto al hueco que hay entre la miga de pan
      // y el propio punto (tapa la cabecera de la época, no la ruta).
      var crumb = document.getElementById('tlCrumb');
      var limite = (crumb ? crumb.getBoundingClientRect().bottom : lvlTop) + 6;
      var borde = punto.getBoundingClientRect().top - 4;    // borde inferior
      var tope = Math.max(100, Math.round(borde - limite));
      detail.classList.add('det-arriba');
      detail.style.maxHeight = tope + 'px';
      detail.style.top = Math.round(borde - detail.offsetHeight - lvlTop) + 'px';
    }

    function placeDetail() {
      if (isVert() && state.level === 1) {
        if (state.seg >= 0 && rowEls[state.seg]) {
          var row = rowEls[state.seg];
          row.parentNode.insertBefore(detail, row.nextSibling);
        } else {
          rail.appendChild(detail); // la pista queda al final de la línea
        }
      } else if (detail.parentNode !== slot) {
        slot.appendChild(detail);
      }
      fitDetail(); // la ventana respeta el hueco que queda en pantalla
    }

    // Al cambiar el tamaño de la ventana se vuelve a medir ese hueco.
    window.addEventListener('resize', function () {
      if (state.seg >= 0) fitDetail();
    });

    // ¿Se han visto ya todas las ventanas de la sublínea en esta sesión?
    // Solo cuentan los hitos con ventana: las cintas de color no son clicables.
    function completa() {
      if (state.level !== 1 || state.band < 0) return false;
      var b = BANDS[state.band], n = 0, v = 0;
      b.segs.forEach(function (s, i) {
        if (s.type === 'cinta') return;
        n++;
        if (vistas[i]) v++;
      });
      return n > 0 && v >= n;
    }

    // Cierra la ventana abierta. `silent` = cierre por hover (el puntero se
    // va): no se roba el foco, que sigue donde lo dejó la persona.
    function closeDetail(silent) {
      var closing = state.seg;
      var back = null;
      if (state.seg >= 0) {
        back = ptEls[state.seg] ? ptEls[state.seg].dot : rowEls[state.seg];
      }
      var finish = function () {
        state.seg = -1;
        markSeg();
        applyDetail();
        syncStage();
        renderCrumb();
        // El foco vuelve a la fila, pero sin mover la página: así al cerrar
        // la vista se queda donde estaba (evita el salto hacia atrás).
        // En el cierre por hover no se toca el foco (sigue donde estaba).
        if (back && back.focus && !silent) back.focus({ preventScroll: true });
        // Si con este cierre se han visto todas las ventanas de la línea,
        // la persona vuelve sola a la línea principal.
        if (completa()) goRoot();
      };
      // En móvil se pliega despacio; en escritorio, directo
      if (isVert() && !noMotion() && detail.offsetHeight > 0) {
        var my = ++animTok;
        detail.style.height = detail.offsetHeight + 'px';
        detail.style.overflow = 'hidden';
        void detail.offsetHeight;
        detail.style.transition = 'height 280ms ease';
        detail.style.height = '0px';
        var done = function (e) {
          if (e && e.propertyName && e.propertyName !== 'height') return;
          detail.removeEventListener('transitionend', done);
          clearTimeout(backup);
          if (my !== animTok) return; // otra animación más reciente mandó
          detail.style.height = '';
          detail.style.overflow = '';
          detail.style.transition = '';
          if (state.seg === closing) finish();
        };
        var backup = setTimeout(done, 400); // respaldo si no llega transitionend
        detail.addEventListener('transitionend', done);
      } else {
        finish();
      }
    }

    // El escenario mide el contenido visible para que nada quede cortado
    function syncStage() {
      var act = lvl[state.level];
      if (act) stage.style.minHeight = act.offsetHeight + 'px';
    }

    /* =====================================================================
       MIGA DE PAN
       ===================================================================== */
    function crumbBtn(text, cb) {
      var b = document.createElement('button');
      b.type = 'button';
      b.textContent = text;
      b.addEventListener('click', cb);
      return b;
    }
    function sep() {
      var s = document.createElement('span');
      s.className = 'crumb-sep';
      s.textContent = '›';
      s.setAttribute('aria-hidden', 'true');
      return s;
    }
    function here(text) {
      var s = document.createElement('span');
      s.className = 'crumb-here';
      s.textContent = text;
      s.setAttribute('aria-current', 'page');
      return s;
    }
    function renderCrumb() {
      crumb.innerHTML = '';
      // En nivel 0 la cabecera del escenario ya dice "Épocas": no se duplica
      if (state.level === 0) return;
      var b = BANDS[state.band];
      crumb.appendChild(crumbBtn('Épocas', function () { goRoot(); }));
      crumb.appendChild(sep());
      if (state.seg < 0) { crumb.appendChild(here(b.name)); return; }
      crumb.appendChild(crumbBtn(b.name, function () { goBand(state.band); }));
      crumb.appendChild(sep());
      crumb.appendChild(here(b.segs[state.seg].title));
    }

    /* =====================================================================
       TRANSICIÓN DE NIVEL: esparcer + zoom (la línea nunca se mueve)
       ===================================================================== */
    function currentRail() {
      var box = lvl[state.level];
      return box ? box.querySelector('.tl-rail') : null;
    }
    // Ejecuta `mutate` (re-render + cambio de nivel) entre la salida y la
    // entrada, con guardas para no solapar dos transiciones.
    function swapLevels(mutate) {
      if (swapping) return;
      if (noMotion()) { mutate(); return; } // movimiento reducido: instantáneo
      var out = currentRail();
      swapping = true;
      if (out) out.classList.add('is-leaving');
      setTimeout(function () {
        if (out) out.classList.remove('is-leaving');
        mutate();
        var inn = currentRail();
        if (inn) {
          inn.classList.add('is-entering');
          setTimeout(function () {
            inn.classList.remove('is-entering');
            swapping = false;
          }, 560);
        } else {
          swapping = false;
        }
      }, 300);
    }
    function show(level) {
      state.level = level;
      lvl.forEach(function (box, i) {
        var on = (i === level);
        box.classList.toggle('is-on', on);
        box.setAttribute('aria-hidden', on ? 'false' : 'true');
      });
      renderCrumb();
    }
    function goRoot() {
      if (swapping) return;
      swapLevels(function () {
        state.band = -1; state.seg = -1;
        renderMaster();   // siempre con la orientación correcta
        show(0);
        syncStage();
      });
    }
    function goBand(i) {
      if (swapping) return;
      swapLevels(function () {
        state.band = i; state.seg = -1;
        vistas = {};        // al entrar a la sublínea empieza el recuento
        renderBand(i);
        show(1);
        markSeg();
        applyDetail();  // pista: "Acércate a un punto…"
        syncStage();
      });
    }

    /* =====================================================================
       ARRANQUE
       ===================================================================== */
    renderMaster();
    renderCrumb();
    syncStage();

    // Cambio entre línea vertical (≤700px) y horizontal
    var onModeChange = function () {
      if (swapping) { setTimeout(onModeChange, 700); return; } // esperar a la transición
      if (state.level === 0) renderMaster();
      else { renderBand(state.band); markSeg(); applyDetail(); }
      syncStage();
    };
    if (mQ.addEventListener) mQ.addEventListener('change', onModeChange);
    else if (mQ.addListener) mQ.addListener(onModeChange);

    // En móvil, tocar fuera del detalle (línea, cabecera…) también lo cierra
    lvl[1].addEventListener('click', function (e) {
      if (!isVert() || state.seg < 0) return;
      if (e.target.closest && e.target.closest('.tl-detail, .vrow')) return;
      closeDetail();
    });

    // El texto puede envolver al cambiar el ancho: recalcular la altura
    var rt = null;
    window.addEventListener('resize', function () {
      if (rt) clearTimeout(rt);
      rt = setTimeout(syncStage, 120);
    });

    // Las fuentes se cargan después: ajustar la altura del escenario
    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(syncStage);
    }
  })();
  </script>

  <script src="scripts/nav-transition.js"></script>
</body>
</html>
