<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Cronograma — Museo de la vida rural El Canario</title>
  <meta name="description" content="Línea del tiempo del museo El Canario: la evolución de la vida rural y agrícola en Chile, contada a través de sus objetos." />
  <meta name="theme-color" content="#0e1813" />
  <link rel="icon" href="assets/svg/Logo.svg" type="image/svg+xml" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;700&family=Montserrat:wght@300;400;700&family=Lato:wght@400;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles/styles.css" />

  <!-- CSS de la imagen desplazable (línea del tiempo) -->
  <style>
    /* Escritorio: mantiene la altura fija de la tarjeta (igual que antes) */
    @media (min-width: 1101px) {
      .card {
        height: 590px;
        min-height: 590px;
        box-sizing: border-box;
      }
      .tl-scroll-wrap {
        width: 70%;
        margin-top: 18px;
        box-sizing: border-box;
      }
      .tl-scroll-viewport {
        width: 92%;
        height: 550px;
      }
    }

    /* Base compartida del viewport desplazable */
    .tl-scroll-wrap { box-sizing: border-box; }

    /* Viewport con scroll horizontal en escritorio y táctil en móvil */
    .tl-scroll-viewport {
      overflow-x: auto;
      overflow-y: hidden;           /* 'center' no es un valor válido; se usa hidden */
      -webkit-overflow-scrolling: touch;
      background: transparent;
      border-radius: 8px;
      box-sizing: border-box;
      outline: none;
      scrollbar-width: thin;
      scrollbar-color: rgba(0,0,0,0.18) transparent;
    }

    /* Foco visible para quien navega con teclado (mismo amarillo del resto del
       sitio). outline:none anterior solo afecta al foco por puntero, que aquí
       no interesa resaltar. */
    .tl-scroll-viewport:focus-visible {
      outline: 3px solid #f4c542;
      outline-offset: 3px;
    }

    /* Imagen larga que ocupa su ancho natural; se desplaza dentro del viewport */
    .tl-scroll-image {
      display: block;
      height: 100%;
      width: auto;
      max-width: none;
      object-fit: cover;
      user-select: none;
      -webkit-user-drag: none;
      pointer-events: none;         /* evita interferir con el arrastre del viewport */
    }

    /* Scrollbar visible y estilizada (WebKit) */
    .tl-scroll-viewport::-webkit-scrollbar { height: 60px; }
    .tl-scroll-viewport::-webkit-scrollbar-track { background: transparent; }
    .tl-scroll-viewport::-webkit-scrollbar-thumb {
      background: rgba(0,0,0,0.18);
      border-radius: 8px;
      transition: background 200ms ease;
    }
    /* Al poner el cursor encima, el pulgar pasa al verde de la marca
       (mismo tono del header fijo y del botón) */
    .tl-scroll-viewport::-webkit-scrollbar-thumb:hover {
      background: var(--brand-green);
    }
    /* Al presionar y arrastrar, un verde más intenso (feedback de "sujeción") */
    .tl-scroll-viewport::-webkit-scrollbar-thumb:active {
      background: #24563e;
    }

    /* Evita marcos o sombras al desplazar */
    .tl-scroll-viewport, .tl-scroll-image { box-shadow: none !important; filter: none !important; }

    /* Móvil / tablet: la tarjeta toma su altura natural y la línea queda centrada,
       sin recortes y a ancho completo. Aquí se mantiene UNA sola tarjeta blanca
       (texto + línea juntos), distinto de las otras páginas que sí separan
       la foto del bloque de texto. */
    @media (max-width: 1100px) {
      .card {
        height: auto !important;
        min-height: 0 !important;
        border-radius: var(--radius) !important;
        background: #ffffff !important;
        box-shadow: 0 18px 40px rgba(0,0,0,0.12) !important;
        overflow: hidden !important;
      }
      /* El texto queda arriba y la línea del tiempo debajo, dentro de la tarjeta */
      .card-copy {
        order: 1 !important;
        background: transparent !important;
        box-shadow: none !important;
        border-radius: 0 !important;
      }
      .tl-scroll-wrap { order: 2 !important; }
      .tl-scroll-wrap {
        position: relative;             /* base de posicionamiento de .tl-hint */
        width: 100% !important;
        margin: 0 !important;
        padding: 0 12px 88px 12px;   /* 88px abajo: deja sitio para el botón del pie */
      }
      /* La línea del tiempo gana altura (y por tanto tamaño en pantalla).
         Antes tenía 320px y en pantallas chicas 240px, lo que dejaba la
         ilustración demasiado pequeña para leerla. */
      .tl-scroll-viewport {
        width: 100% !important;
        height: 440px;
      }
      .tl-scroll-viewport::-webkit-scrollbar { height: 24px; }

      /* El botón "VOLVER ATRÁS" pasa al pie de la tarjeta, bajo la línea del
         tiempo. Solo en móvil: en escritorio sigue dentro del bloque de texto.
         La tarjeta es position:relative, así que el botón se ancla a ella; el
         espacio libre lo deja el padding inferior de .tl-scroll-wrap. Se centra
         con márgenes automáticos (no con transform) para no pisar el
         translateY(-2px) del hover de .btn-primary. */
      #cta-recorrer {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 24px;
        width: fit-content;
        margin: 0 auto !important;
        /* .tl-scroll-wrap es position:relative y va después en el DOM: sin
           z-index el wrap pintaba por encima y se tragaba el toque, dejando
           el botón visible pero sin responder en móvil */
        z-index: 1;
      }
    }
    @media (max-width: 700px) {
      .tl-scroll-viewport { height: 360px; }
      .tl-scroll-viewport::-webkit-scrollbar { height: 18px; }
    }

    /* --- Pista táctil: círculo translúcido que invita a arrastrar la línea ---
       Vive FUERA del viewport desplazable (es hermano suyo), para que no se
       vaya de la pantalla cuando el usuario arrastre.
       Condiciones para verse: dispositivo sin hover (móvil/tablet táctil) y
       que el contenedor tenga la clase .is-hinting, que añade el script al
       cargar y elimina para siempre en el primer desplazamiento real. */
    .tl-hint { display: none; }

    @media (hover: none) {
      .tl-scroll-wrap.is-hinting .tl-hint {
        display: block;
        position: absolute;
        /* top/bottom delimitan justo el área del visor: el wrap tiene
           88px de padding inferior reservados para el botón del pie */
        top: 0;
        bottom: 88px;
        left: 0;
        right: 0;
        z-index: 2;
        pointer-events: none;
      }

      .tl-hint::before,
      .tl-hint::after {
        content: "";
        position: absolute;
        top: 50%;
        left: 78%;
        pointer-events: none;
        animation: tlHintSwipe 2s ease-in-out infinite;
      }

      /* el círculo (margen negativo para centrarlo sobre left/top) */
      .tl-hint::before {
        width: 44px;
        height: 44px;
        margin: -22px 0 0 -22px;
        border-radius: 50%;
        background: rgba(47,107,79,0.30);
        border: 2px solid rgba(47,107,79,0.45);
        box-shadow: 0 0 24px rgba(47,107,79,0.35);
        opacity: 0.5;
      }

      /* el rastro: va a la derecha del círculo (detrás, porque el círculo
         viaja de derecha a izquierda) y se desvanece hacia la derecha */
      .tl-hint::after {
        width: 96px;
        height: 14px;
        margin: -7px 0 0 -14px;
        border-radius: 999px;
        background: linear-gradient(90deg, rgba(47,107,79,0.22), rgba(47,107,79,0));
        filter: blur(4px);
        opacity: 0.5;
        animation-delay: 0.18s;      /* va con retardo: queda detrás del círculo */
      }
    }

    /* Recorrido invertido: sale desde la derecha y cruza hacia la izquierda,
       que es el gesto real con el que se desplaza la línea para ver más */
    @keyframes tlHintSwipe {
      0%   { left: 78%; opacity: 0; }
      18%  { opacity: 0.55; }
      78%  { opacity: 0.55; }
      100% { left: 8%;  opacity: 0; }
    }

    /* Con "menos movimiento" el indicador no se anima: queda fijo en el inicio,
       que sigue comunicando "arrastra" sin desplazar nada por la pantalla */
    @media (prefers-reduced-motion: reduce) {
      .tl-hint::before,
      .tl-hint::after { animation: none; }
    }
  </style>
</head>
<body>
  <div class="viewport-fixed">

    <!-- Header fijo -->
    <header class="site-header" role="banner">
      <div class="header-inner">
        <a class="brand" href="index.html">
          <img src="assets/svg/Logo.svg" alt="Logo Museo El Canario" class="logo-img" />
          <span class="brand-text">Museo de la vida rural El Canario</span>
        </a>

        <nav class="main-nav" aria-label="Navegación principal">
          <a href="cronograma.html" class="nav-link">Cronograma</a>
          <a href="imagenes.html" class="nav-link">Imágenes</a>
          <a href="biografia.html" class="nav-link">Biografía</a>
          <a href="contacto.html" class="nav-link">Contacto</a>
        </nav>

        <!-- Toggle móvil -->
        <button class="menu-toggle" id="menuToggle" aria-label="Abrir menú" aria-expanded="false" type="button">
          <svg class="menu-icon" width="48" height="48" viewBox="0 0 48 48" aria-hidden="true" focusable="false">
            <circle class="menu-circle" cx="24" cy="24" r="20" fill="#c0392b" />
            <g class="bars" stroke="#fff" stroke-linecap="round" stroke-width="3" stroke-linejoin="round">
              <line class="bar top" x1="14" y1="18" x2="34" y2="18" />
              <line class="bar bottom" x1="14" y1="30" x2="34" y2="30" />
            </g>
          </svg>
        </button>
      </div>
    </header>

    <!-- Menú desplegable móvil -->
    <aside class="floating-menu" id="floatingMenu" aria-hidden="true">
      <div class="floating-inner">
        <nav class="floating-nav" aria-label="Navegación flotante">
          <a href="cronograma.html">Cronograma</a>
          <a href="imagenes.html">Imágenes</a>
          <a href="biografia.html">Biografía</a>
          <a href="contacto.html">Contacto</a>
        </nav>
      </div>
    </aside>

    <!-- Hero -->
    <main class="hero" role="main" aria-label="Hero">
      <div class="hero-overlay" aria-hidden="true"></div>

      <section class="card container" role="region" aria-label="Tarjeta principal">
        <div class="card-inner">
          <div class="card-copy">
            <h1 class="card-title">Cronograma
            </h1>
            <p class="card-lead">
              En la siguiente línea verá la evolución de la vida rural y agrícola en Chile.
            </p>

            <a id="cta-recorrer" class="btn-primary" href="index.html">VOLVER ATRÁS</a>
          </div>

          <!-- Contenedor de la imagen desplazable (línea del tiempo) -->
          <div class="tl-scroll-wrap">
            <div class="tl-scroll-viewport" id="tlScrollViewport" tabindex="0" role="region" aria-label="Línea del tiempo, contenido desplazable en horizontal">
              <img class="tl-scroll-image" src="assets/svg/linea-tl.svg" alt="Línea del tiempo de la vida rural y agrícola en Chile" decoding="async" />
            </div>
            <!-- Pista visual de arrastre (solo móvil, decorativa) -->
            <span class="tl-hint" aria-hidden="true"></span>
          </div>

        </div>
      </section>

    </main>

  </div>

  <script src="scripts/menu.js"></script>

  <!-- Script para arrastrar y asegurar scrollbar en escritorio -->
  <script>
  (function(){
    const viewport = document.getElementById('tlScrollViewport');
    if (!viewport) return;

    // El foco se ve por teclado gracias a .tl-scroll-viewport:focus-visible
    // (antes se anulaba el outline desde JS, con lo que un usuario de teclado
    // no veía nunca dónde estaba el foco).

    // Drag to scroll (mouse)
    let isDown = false;
    let startX;
    let scrollLeft;

    viewport.addEventListener('mousedown', (e) => {
      isDown = true;
      viewport.classList.add('dragging');
      startX = e.pageX - viewport.getBoundingClientRect().left;
      scrollLeft = viewport.scrollLeft;
      document.body.style.userSelect = 'none';
    });

    window.addEventListener('mouseup', () => {
      isDown = false;
      viewport.classList.remove('dragging');
      document.body.style.userSelect = '';
    });

    viewport.addEventListener('mousemove', (e) => {
      if (!isDown) return;
      e.preventDefault();
      const x = e.pageX - viewport.getBoundingClientRect().left;
      const walk = (x - startX) * 1.2; // sensibilidad
      viewport.scrollLeft = scrollLeft - walk;
    });

    // Touch support (arrastrar con el dedo)
    let touchStartX = 0, touchStartScroll = 0;
    viewport.addEventListener('touchstart', (e) => {
      touchStartX = e.touches[0].pageX;
      touchStartScroll = viewport.scrollLeft;
    }, {passive:true});

    viewport.addEventListener('touchmove', (e) => {
      const dx = e.touches[0].pageX - touchStartX;
      viewport.scrollLeft = touchStartScroll - dx;
    }, {passive:true});

    // Asegurar que la imagen sea más ancha que el viewport para que aparezca la barra
    const img = viewport.querySelector('.tl-scroll-image');
    function ensureScrollable() {
      if (!img) return;
      const vw = viewport.clientWidth;
      const naturalW = img.naturalWidth || 0;
      if (naturalW <= vw) {
        // forzamos un ancho mayor para que aparezca scroll; ajusta si quieres otro valor
        img.style.width = (vw + 600) + 'px';
      } else {
        img.style.width = 'auto';
      }
    }

    // Ejecutar al cargar la imagen y al redimensionar
    if (img && img.complete) ensureScrollable();
    if (img) img.addEventListener('load', ensureScrollable);
    window.addEventListener('resize', ensureScrollable);

    // Pequeña pista de scroll en desktop (se omite si el usuario pide
    // menos movimiento)
    function flashHint() {
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      if (window.matchMedia('(pointer:fine)').matches) {
        const start = viewport.scrollLeft;
        viewport.scrollBy({ left: 60, behavior: 'smooth' });
        setTimeout(() => viewport.scrollTo({ left: start, behavior: 'smooth' }), 450);
      }
    }
    setTimeout(flashHint, 350);

    // Pista táctil: un círculo translúcido en bucle invita a arrastrar la línea
    // con el dedo. Solo en pantallas sin hover (móvil/tablet táctil) y mientras
    // la línea sea realmente desplazable. Desaparece para siempre en el primer
    // scroll real: si se toca sin mover, scrollLeft no cambia y el navegador no
    // dispara el evento, así que la pista sigue hasta que se arrastra de verdad.
    const hintWrap = viewport.closest('.tl-scroll-wrap');
    const hintEl = hintWrap ? hintWrap.querySelector('.tl-hint') : null;
    if (hintEl && window.matchMedia('(hover: none)').matches) {
      let hintDismissed = false;

      function hideHint() {
        if (hintDismissed) return;
        hintDismissed = true;
        hintWrap.classList.remove('is-hinting');
      }

      function syncHint() {
        if (hintDismissed) return;
        const scrollable = viewport.scrollWidth > viewport.clientWidth + 1;
        hintWrap.classList.toggle('is-hinting', scrollable);
      }

      if (img && img.complete) syncHint();
      else if (img) img.addEventListener('load', syncHint);
      window.addEventListener('resize', syncHint);
      viewport.addEventListener('scroll', hideHint, { passive: true });
    }
  })();
  </script>

<script src="scripts/nav-transition.js"></script>
</body>
</html>
